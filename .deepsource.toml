version = 1

# Real secret detection runs locally and in CI via secretlint:
#  - pre-commit hook: pnpm run pre-commit secretlint scan
#  - CI gate:         pnpm run security secretlint scan
#  - implementation:  scripts/secretlint-repo.mjs + scripts/secretlint-staged.mjs
#
# The DeepSource built-in Secrets analyzer is intentionally not enabled here.
# Its SCT-A000 regex repeatedly false-positives on this repo's npm script
# names and on documented placeholder values inside design specs (e.g.
# example env-var assignments in docs/superpowers/**), and there is no
# per-finding ignore mechanism short of the DeepSource UI. Keeping it off
# avoids churn without giving up coverage that secretlint already provides.

[[analyzers]]
name = "javascript"

  [analyzers.meta]
  plugins = ["react"]
  environment = ["nodejs"]

[[analyzers]]
name = "test-coverage"
